[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "life-datatypes"
version = "1.0.0"
description = "Shared conversation data types for the Ushadow ecosystem"
authors = ["Ushadow Contributors <dev@ushadow.io>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/ushadow-io/life-datatypes"
repository = "https://github.com/ushadow-io/life-datatypes"
keywords = ["conversation", "asr", "nlp", "data-types", "schema", "ushadow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

packages = [
    { include = "life_datatypes", from = "generated/python" }
]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
datamodel-code-generator = "^2.25.0"
