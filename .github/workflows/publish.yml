name: Publish to npm and PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  codegen:
    name: Generate types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm install

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install datamodel-code-generator

      - name: Generate TypeScript types
        run: npm run codegen:typescript

      - name: Generate Python types
        run: python scripts/codegen-python.py

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v4
        env:
          REF_NAME: ${{ github.ref_name }}
        with:
          commit_message: 'chore: regenerate types'
          file_pattern: 'generated/**'

  publish-npm:
    name: Publish to npm
    needs: codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install poetry
        run: pip install poetry

      - name: Publish to PyPI
        run: poetry publish --build
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}

  release:
    name: Create GitHub Release
    needs: [publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            Published to:
            - npm: https://www.npmjs.com/package/life-datatypes
            - PyPI: https://pypi.org/project/life-datatypes/
          draft: false
          prerelease: false
